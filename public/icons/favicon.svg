
  <svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#05282F"/>
        <stop offset="45%" stop-color="#007F88"/>
        <stop offset="100%" stop-color="#24B9B4"/>
      </linearGradient>
      <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="100%" stop-color="#E2F8F5"/>
      </linearGradient>
      <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
        <stop offset="0%" stop-color="#6FF2DD" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#6FF2DD" stop-opacity="0"/>
      </linearGradient>
      <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#021C22" flood-opacity="0.35"/>
      </filter>
    </defs>

    <!-- Background -->
    <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
    <circle cx="102.4" cy="25.6" r="51.2" fill="url(#glowGrad)"/>

    <!-- Centered Logo Graphics -->
    <g transform="translate(0, 0)">
      <g filter="url(#dropShadow)" transform="translate(23.04, 28.16)">
        <!-- Main Card Shape -->
        <rect x="0" y="0" width="81.92" height="56.32" rx="11.52" fill="url(#cardGrad)"/>
        
        <!-- Card Magnetic Strip / Horizon Line -->
        <rect x="0" y="12.8" width="81.92" height="10.24" fill="#007F88" fill-opacity="0.9"/>
        
        <!-- Smart Chip / Growth Sparkle -->
        <circle cx="19.2" cy="35.84" r="5.76" fill="#0C5F68"/>
        
        <!-- Mini Wave Bars (Finance Growth) -->
        <rect x="40.96" y="38.4" width="5.76" height="7.68" rx="2.56" fill="#007F88"/>
        <rect x="51.2" y="32" width="5.76" height="14.08" rx="2.56" fill="#007F88"/>
        <rect x="61.44" y="25.6" width="5.76" height="20.48" rx="2.56" fill="#00A6A6"/>
      </g>

      <!-- Dynamic Coin / Savings Dot -->
      <circle cx="92.16" cy="38.4" r="11.52" fill="#6FF2DD" stroke="#007F88" stroke-width="3.2" filter="url(#dropShadow)"/>
      <path d="M 92.16 32 L 92.16 44.8 M 85.76 38.4 L 98.56 38.4" stroke="#007F88" stroke-width="2.56" stroke-linecap="round"/>
    </g>
  </svg>
  